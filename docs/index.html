<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Phone Apps</title>
<style>
:root{--bg:#eeece5;--fg:#1c1b17;--muted:#6a655a;--line:#b9b4a6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171612;--fg:#ebe6d8;--muted:#a19a88;--line:#4a463c;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,sans-serif;padding:max(24px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
main{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0}
p{margin:0;color:var(--muted)}
a{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;font-weight:600}
img{width:52px;height:52px;border-radius:12px}
</style></head><body><main>
<h1>Phone apps</h1>
<p>Open one in Safari, then Share › Add to Home Screen.</p>
<a href="newspaper/"><img src="newspaper/icon-180.png" alt="">The Newspaper</a>
<a href="launch-plan/"><img src="launch-plan/icon-180.png" alt="">Launch Plan</a>
</main></body></html>
