<title>Newspaper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Archivo+Narrow:wght@500;700&display=swap">
<style>
/* Layout: a newsstand where every topic is its own newspaper: one sheet, printed front and back, that flips over. */
:root{
  --paper:#eeece5; --paper-2:#e4e1d7; --sheet:#f5f3ec; --desk:#d3cdbf; --ink:#1c1b17; --ink-2:#3d3a33; --muted:#6a655a; --rule:#1c1b17; --hair:#b9b4a6; --accent:#8e1d14;
  --wood:#5b4331; --wood-hi:#7a5c44; --wood-lo:#3a2a1e; --tag:#f7f3e3; --stamp:#8e1d14; --stamp-ink:#fbf6ea;
  --f-mast:"UnifrakturMaguntia","Old English Text MT",Georgia,serif;
  --f-head:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-label:"Archivo Narrow","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#171612;--paper-2:#201e19;--sheet:#1e1c18;--desk:#0e0d0b;--ink:#ebe6d8;--ink-2:#cfc9b8;--muted:#a19a88;--rule:#ebe6d8;--hair:#4a463c;--accent:#e57a68;--wood:#3b2c21;--wood-hi:#54402f;--wood-lo:#231a13;--tag:#2a2721;--stamp:#c2483a;--stamp-ink:#fbf6ea;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#171612;--paper-2:#201e19;--sheet:#1e1c18;--desk:#0e0d0b;--ink:#ebe6d8;--ink-2:#cfc9b8;--muted:#a19a88;--rule:#ebe6d8;--hair:#4a463c;--accent:#e57a68;--wood:#3b2c21;--wood-hi:#54402f;--wood-lo:#231a13;--tag:#2a2721;--stamp:#c2483a;--stamp-ink:#fbf6ea;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6}
body.reading{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{cursor:pointer}

/* newsstand */
.stand{max-width:1180px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mast{text-align:center;margin:8px 0 6px}
.mast h1{font-family:var(--f-mast);font-weight:400;font-size:clamp(46px,9vw,104px);line-height:1;margin:0}
.motto{font-style:italic;color:var(--ink-2);font-size:15px;margin-top:4px}
.dateline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:6px 2px;margin:12px 0 22px;font-family:var(--f-label);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase}
.shelf{font-family:var(--f-head);font-weight:900;font-size:1.15rem;margin:26px 0 10px;text-align:center}
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:30px clamp(16px,3vw,34px);padding:24px clamp(14px,3vw,30px);background:var(--paper-2);border:1px solid var(--hair)}
@media (min-width:640px){.rack{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.slot{display:flex;flex-direction:column;min-width:0}
.cover{position:relative;display:block;width:100%;aspect-ratio:.72;padding:0;border:1px solid var(--hair);background:var(--sheet);color:var(--ink);text-align:left;font:inherit;overflow:hidden;container-type:size;box-shadow:0 6px 14px rgba(0,0,0,.18);transition:transform .25s ease}
.cover:hover,.cover:focus-visible{transform:translateY(-6px) rotate(-.6deg)}
.cv{position:absolute;inset:0;padding:5cqw;display:flex;flex-direction:column;gap:1.6cqw}
.cv .m{font-family:var(--f-mast);font-size:11.5cqw;line-height:1.05;text-align:center;white-space:nowrap}
.cv .d{display:flex;justify-content:space-between;border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:.8cqw .3cqw;font-family:var(--f-label);font-size:3cqw;letter-spacing:.08em;text-transform:uppercase}
.cv .k{font-family:var(--f-label);font-weight:700;font-size:3.4cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-top:1.6cqw}
.cv .h{font-family:var(--f-head);font-weight:900;font-size:8cqw;line-height:1.08;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;flex:none}
.cv .x{font-size:4.2cqw;line-height:1.35;color:var(--ink-2);flex:1;min-height:0;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.stamp{position:absolute;bottom:6px;right:6px;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--stamp);color:var(--stamp-ink);font-family:var(--f-label);font-weight:700;font-size:10px;letter-spacing:.1em;text-transform:uppercase;transform:rotate(12deg)}
.lip{position:relative;height:14px;margin-top:-3px;border-radius:2px;background:linear-gradient(var(--wood-hi),var(--wood) 45%,var(--wood-lo));box-shadow:0 6px 10px -4px rgba(0,0,0,.45)}
.tag{align-self:center;display:flex;align-items:center;gap:8px;margin-top:8px;padding:3px 8px;background:var(--tag);border:1px solid var(--hair);font-family:var(--f-label);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-variant-numeric:tabular-nums}
.icon{display:inline-flex;align-items:center;gap:6px;font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:2px 4px;min-height:24px}
.icon svg{width:15px;height:15px;flex:none}
.icon:hover{color:var(--accent)}
.notice{text-align:center;padding:60px 16px}
.notice h2{font-family:var(--f-head);font-weight:900;font-size:30px;margin:0 0 8px}
.notice p{margin:0 auto;max-width:52ch;color:var(--ink-2)}

/* reader: one sheet, front and back */
.reader{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--desk);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rbar{display:flex;align-items:center;gap:8px;padding:10px 0;min-height:56px}
.rbar button{font-family:var(--f-label);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--sheet);border:1px solid var(--hair);border-radius:3px;padding:8px 11px;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.rbar svg{width:15px;height:15px}
.rbar .sp{flex:1}
#flip{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.stage{flex:1;min-height:0;display:grid;place-items:center;perspective:1800px}
.sheet{position:relative;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:pointer}
.sheet.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;background:var(--sheet);color:var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 24px rgba(0,0,0,.3);container-type:size}
.face.b{transform:rotateY(180deg)}
.sheet:not(.turned) .face.b,.sheet.turned .face.f{pointer-events:none}
.hint{text-align:center;font-family:var(--f-label);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:8px 0 10px}
.f-mast{font-family:var(--f-mast);font-size:min(12cqw,58px);line-height:1.05;text-align:center;white-space:nowrap}
.f-date{display:flex;justify-content:space-between;gap:8px;border-top:3px double var(--rule);border-bottom:1px solid var(--rule);padding:3px 2px;margin:4px 0 10px;font-family:var(--f-label);font-size:11px;letter-spacing:.09em;text-transform:uppercase;white-space:nowrap}
.f-k{font-family:var(--f-label);font-weight:700;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.f-h{font-family:var(--f-head);font-weight:900;font-size:min(7.2cqw,36px);line-height:1.08;margin:3px 0 5px;text-wrap:balance}
.f-d{font-family:var(--f-head);font-style:italic;font-weight:700;font-size:min(4.1cqw,17px);line-height:1.28;color:var(--ink-2);margin:0 0 5px}
.f-by{font-family:var(--f-label);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:9px}
.rh{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--rule);padding-bottom:3px;margin-bottom:9px;font-family:var(--f-label);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rh .m{font-family:var(--f-mast);font-size:16px;letter-spacing:0;text-transform:none;color:var(--ink)}
.folio{flex:none;margin-top:6px;text-align:center;font-family:var(--f-label);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

.tx{flex:1;min-height:0;overflow:hidden;font-size:var(--fs,14px);line-height:1.42;hyphens:auto;-webkit-hyphens:auto;column-fill:auto;column-gap:18px;column-rule:1px solid var(--hair)}
.tx.two{columns:2}
.tx.scroll{overflow-y:auto;columns:auto;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text;cursor:auto}
.f .tx>p:first-child::first-letter{font-family:var(--f-head);font-weight:900;float:left;font-size:3em;line-height:.82;padding:4px 6px 0 0;color:var(--accent)}
.tx h2,.tx h3,.tx h4{font-family:var(--f-head);font-weight:900;line-height:1.15;margin:.8em 0 .3em;break-after:avoid}
.tx>:first-child{margin-top:0}
.tx h2{font-size:1.2em;border-top:1px solid var(--rule);padding-top:.3em}
.tx>h2:first-child{border-top:0;padding-top:0}
.tx h3{font-size:1.1em}.tx h4{font-size:1em}
.tx p{margin:0 0 .55em}
.tx ul,.tx ol{margin:0 0 .6em;padding-left:1.2em}
.tx li{margin:.12em 0}
.tx blockquote{margin:.6em 0;padding:1px 0 1px 10px;border-left:3px solid var(--accent);font-style:italic;color:var(--ink-2)}
.tx code{font-family:ui-monospace,"Courier New",monospace;font-size:.84em;background:var(--paper-2);padding:1px 3px;border-radius:3px;overflow-wrap:anywhere}
.tx pre{background:var(--paper-2);padding:6px 8px;font-size:.84em;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 .6em}
.tx pre code{background:none;padding:0}
.tx hr{border:0;border-top:3px double var(--rule);margin:.8em 0}
.tx a{color:var(--accent);overflow-wrap:anywhere}
.tx .tablewrap{overflow-x:auto;margin:0 0 .7em;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule)}
.tx table{border-collapse:collapse;width:100%;font-size:.88em;line-height:1.3}
.tx th{font-family:var(--f-label);font-size:.85em;letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:4px 5px;border-bottom:1px solid var(--rule)}
.tx td{padding:3px 5px;border-bottom:1px solid var(--hair);vertical-align:top}
.tx .end{text-align:center;color:var(--accent);font-size:.7em;margin:.4em 0}
.tx .file{font-family:var(--f-label);font-size:.78em;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.more{break-inside:avoid;border-top:2px solid var(--rule);margin-top:10px;padding-top:4px}
.more b{display:block;font-family:var(--f-label);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.more button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:5px 0;font-family:var(--f-head);font-weight:700;font-size:13.5px;line-height:1.2;color:var(--ink);min-height:30px}
.more button:hover{text-decoration:underline}

/* trash: papers can always be put back */
.tbox{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.tpanel{background:var(--sheet);color:var(--ink);border:1px solid var(--rule);width:min(560px,100%);max-height:min(80vh,720px);display:flex;flex-direction:column}
.tpanel header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:3px double var(--rule)}
.tpanel h2{font-family:var(--f-head);font-weight:900;font-size:24px;margin:0}
.tlist{overflow:auto;padding:4px 16px 12px}
.trow{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair);font-family:var(--f-head);font-size:15px;line-height:1.25}
.trow span{flex:1;min-width:0}
.tb{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:1px solid var(--hair);border-radius:3px;padding:7px 10px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;display:flex;gap:14px;align-items:center;background:var(--ink);color:var(--sheet);padding:10px 16px;border-radius:4px;font-family:var(--f-label);font-size:13px;max-width:calc(100vw - 32px)}
.toast button{font:inherit;font-weight:700;text-transform:uppercase;color:var(--sheet);background:none;border:1px solid currentColor;border-radius:3px;padding:4px 9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stand">
  <header class="mast"><h1>The Newspaper</h1><div class="motto">One topic, one paper, front and back</div></header>
  <div class="dateline"><span id="today"></span><span id="count"></span><button class="icon" id="trashBtn" type="button"></button></div>
  <main id="rack"><div class="notice"><h2>Stop the presses…</h2><p>The papers are on their way to the stand.</p></div></main>
</div>

<div class="reader" id="reader" hidden>
  <header class="rbar">
    <button id="toStand" type="button" aria-label="Back to the newsstand">← Stand</button>
    <span class="sp"></span>
    <button id="trashOne" type="button" aria-label="Move this paper to the trash"></button>
    <button id="flip" type="button">Flip to back</button>
  </header>
  <div class="stage" id="stage"><div class="sheet" id="sheet">
    <article class="face f" id="front"></article>
    <article class="face b" id="back"></article>
  </div></div>
  <div class="hint">Tap the paper to flip it over</div>
</div>

<div class="tbox" id="tbox" hidden role="dialog" aria-modal="true" aria-labelledby="ttitle">
  <div class="tpanel"><header><h2 id="ttitle">The Trash Can</h2><button class="tb" type="button" id="tclose">Close</button></header><div class="tlist" id="tlist"></div></div>
</div>
<div class="toast" id="toast" hidden role="status"><span id="toastMsg"></span><button type="button" id="toastUndo">Undo</button></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const BIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 10v7M14 10v7"/></svg>';

/* ---- a small Markdown reader for report bodies ---- */
function inline(t) {
  t = esc(t);
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  t = t.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>');
  return t;
}
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n'), out = [];
  let i = 0;
  const isTable = l => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    let l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (/^```/.test(l)) { const buf = []; i++; while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]); i++; out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>'); continue; }
    const h = /^(#{1,4})\s+(.*)$/.exec(l);
    if (h) { const n = Math.min(4, h[1].length + 1); out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
    if (isTable(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const row = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
      const head = row(l); i += 2; const body = [];
      while (i < lines.length && isTable(lines[i])) body.push(row(lines[i++]));
      out.push('<div class="tablewrap"><table><thead><tr>' + head.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
        body.map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>');
      continue;
    }
    if (/^\s*>/.test(l)) { const buf = []; while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, '')); out.push('<blockquote>' + inline(buf.join(' ')) + '</blockquote>'); continue; }
    if (/^\s*([-*]|\d+[.)])\s+/.test(l)) {
      /* lists, nested by indentation */
      const stack = [];
      while (i < lines.length && (/^\s*([-*]|\d+[.)])\s+/.test(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && stack.length))) {
        const m = /^(\s*)([-*]|\d+[.)])\s+(.*)$/.exec(lines[i]);
        if (!m) { stack.length && (stack[stack.length - 1].items[stack[stack.length - 1].items.length - 1] += ' ' + inline(lines[i].trim())); i++; continue; }
        const depth = m[1].replace(/\t/g, '  ').length, tag = /\d/.test(m[2]) ? 'ol' : 'ul';
        while (stack.length && depth < stack[stack.length - 1].depth) { const done = stack.pop(); const html = `<${done.tag}>` + done.items.map(x => `<li>${x}</li>`).join('') + `</${done.tag}>`; stack[stack.length - 1] ? stack[stack.length - 1].items[stack[stack.length - 1].items.length - 1] += html : out.push(html); }
        if (!stack.length || depth > stack[stack.length - 1].depth) stack.push({ depth, tag, items: [] });
        stack[stack.length - 1].items.push(inline(m[3])); i++;
      }
      while (stack.length) { const done = stack.pop(); const html = `<${done.tag}>` + done.items.map(x => `<li>${x}</li>`).join('') + `</${done.tag}>`; stack.length ? stack[stack.length - 1].items[stack[stack.length - 1].items.length - 1] += html : out.push(html); }
      continue;
    }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*([-*]|\d+[.)])\s+|\s*>)/.test(lines[i]) && !isTable(lines[i])) buf.push(lines[i++].trim());
    out.push('<p>' + inline(buf.join(' ')) + '</p>');
  }
  return out.join('\n');
}

const fmtLong = d => { const x = new Date((d || '') + 'T12:00'); return isNaN(x) ? 'Undated' : x.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }); };
const fmtShort = d => { const x = new Date((d || '') + 'T12:00'); return isNaN(x) ? 'Undated' : x.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };

/* every story is one whole paper. Numbers count up from the oldest and never shift when a paper is trashed. */
let all = [], papers = [], ready = false, cur = null;
let trash; try { trash = JSON.parse(store.get('np2-trash')) || {}; } catch { trash = {}; }
const saveTrash = () => store.set('np2-trash', JSON.stringify(trash));
const auto = p => p.section === 'Agent Desk';
function index() {
  const sorted = [...all].sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || (b.lead ? 1 : 0) - (a.lead ? 1 : 0) || (a.order ?? 99) - (b.order ?? 99) || String(b.id).localeCompare(String(a.id)));
  sorted.forEach((p, i) => { p.no = sorted.length - i; });
  papers = sorted.filter(p => !(p.id in trash));
}
const plain = b => String(b || '').split(/\n\s*\n/).map(p => p.trim()).find(p => p && !/^(#|\||```|>)/.test(p))?.replace(/^\s*([-*]|\d+[.)])\s+/, '').replace(/[*`]/g, '') || '';

function drawStand() {
  $('#count').textContent = `${papers.length} ${papers.length === 1 ? 'paper' : 'papers'}`;
  const ids = Object.keys(trash).filter(id => all.some(p => p.id === id));
  $('#trashBtn').innerHTML = BIN + `<span>${ids.length ? `Trash (${ids.length})` : 'Trash'}</span>`;
  const card = (p, latest) => `<div class="slot"><button class="cover" type="button" data-open="${esc(p.id)}" aria-label="Read: ${esc(p.headline)}">
      <div class="cv"><div class="m">The Newspaper</div><div class="d"><span>No. ${p.no}</span><span>${esc(fmtShort(p.date))}</span></div>
      <div class="k">${esc(p.section || 'Report')}</div><div class="h">${esc(p.headline)}</div><div class="x">${esc(p.dek || plain(p.body))}</div></div>
      ${latest ? '<span class="stamp">Latest</span>' : ''}</button><div class="lip"></div>
      <div class="tag"><span>No. ${p.no} · ${esc(fmtShort(p.date))}</span><button class="icon" type="button" data-trash="${esc(p.id)}" aria-label="Move ${esc(p.headline)} to the trash">${BIN}</button></div></div>`;
  const main = papers.filter(p => !auto(p)), reports = papers.filter(auto);
  const shelf = (t, l, stamp) => l.length ? `<h2 class="shelf">${t}</h2><div class="rack">${l.map((p, i) => card(p, stamp && !i)).join('')}</div>` : '';
  $('#rack').innerHTML = papers.length ? shelf('The Papers', main, true) + shelf('Agent Reports', reports, false)
    : `<div class="notice"><h2>The stand is empty</h2><p>Ask Claude or the Coach for a paper. If you put papers in the trash, they can come back from there.</p></div>`;
}

/* ---- fitting a story onto the two sides of one sheet ---- */
const over = el => el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
function keepWords(el, n, first) {
  /* a copy of a paragraph with only its first n words, or everything after them; inline markup survives */
  const c = el.cloneNode(true), w = document.createTreeWalker(c, NodeFilter.SHOW_TEXT), nodes = [];
  while (w.nextNode()) nodes.push(w.currentNode);
  let seen = 0;
  for (const t of nodes) {
    const parts = t.nodeValue.split(/(\s+)/);
    t.nodeValue = parts.filter(x => { if (!x.trim()) return true; seen++; return first ? seen <= n : seen > n; }).join('');
  }
  c.innerHTML = c.innerHTML.trim();
  return c;
}
const words = el => el.textContent.trim().split(/\s+/).length;
/* pour blocks into the box until full; return whatever did not fit */
function pour(box, blocks) {
  const left = [...blocks];
  while (left.length) {
    const n = left[0];
    box.appendChild(n);
    if (!over(box)) { left.shift(); continue; }
    n.remove();
    if (n.tagName === 'P') {
      let lo = 0, hi = words(n);
      while (hi - lo > 1) { const mid = (lo + hi) >> 1, t = keepWords(n, mid, true); box.appendChild(t); over(box) ? hi = mid : lo = mid; t.remove(); }
      if (lo >= 8) { box.appendChild(keepWords(n, lo, true)); left[0] = keepWords(n, lo, false); }
    } else if (n.tagName === 'UL' || n.tagName === 'OL') {
      const part = n.cloneNode(false); box.appendChild(part);
      const items = [...n.children];
      while (items.length) { part.appendChild(items[0]); if (over(box)) { items[0].remove(); break; } items.shift(); }
      if (!part.children.length) part.remove();
      if (!items.length) { left.shift(); continue; }
      n.replaceChildren(...items);
    }
    break;
  }
  /* no heading stranded at the bottom of a side */
  const last = box.lastElementChild;
  if (last && /^H[2-4]$/.test(last.tagName)) { last.remove(); left.unshift(last); }
  return left;
}
function blocksOf(p) {
  const t = document.createElement('template');
  t.innerHTML = md(p.body) + (p.source ? `<p class="file">On file: ${esc(p.source)}</p>` : '') + '<p class="end">■</p>';
  return [...t.content.children];
}
function layout() {
  const p = cur; if (!p) return;
  const st = $('#stage'), aw = st.clientWidth, ah = st.clientHeight;
  let H = Math.min(ah - 8, 980), W = Math.min(aw, H * .78, 680);
  H = Math.min(H, W * 1.75);
  W = Math.floor(W); H = Math.floor(H);
  const pad = W < 440 ? 14 : 22, sheet = $('#sheet');
  sheet.style.width = W + 'px'; sheet.style.height = H + 'px';
  const two = W >= 560 ? ' two' : '';
  $('#front').style.padding = $('#back').style.padding = pad + 'px';
  $('#front').innerHTML = `<div class="f-mast">The Newspaper</div>
    <div class="f-date"><span>No. ${p.no}</span><span>${esc(fmtLong(p.date))}</span></div>
    <div class="f-k">${esc(p.section || 'Report')}</div><h1 class="f-h">${esc(p.headline)}</h1>
    ${p.dek ? `<p class="f-d">${esc(p.dek)}</p>` : ''}<div class="f-by">${esc(p.byline || 'Staff report')}</div>
    <div class="tx${two}" id="txF"></div><div class="folio">Turn over →</div>`;
  $('#back').innerHTML = `<div class="rh"><span class="m">The Newspaper</span><span>No. ${p.no} · ${esc(fmtShort(p.date))}</span></div>
    <div class="tx${two}" id="txB"></div><div class="folio">← Back side</div>`;
  const F = $('#txF'), B = $('#txB'), top = W < 440 ? 14 : 15;
  let fit = false;
  for (let fs = top; fs >= 12 && !fit; fs -= .5) {
    F.style.setProperty('--fs', fs + 'px'); B.style.setProperty('--fs', fs + 'px');
    F.innerHTML = ''; B.innerHTML = '';
    const rest = pour(F, blocksOf(p));
    fit = !pour(B, rest).length;
  }
  if (!fit) {
    /* very long older reports: smallest type, and the back scrolls so no words are lost */
    F.innerHTML = ''; B.innerHTML = ''; B.className = 'tx scroll';
    pour(F, blocksOf(p)).forEach(n => B.appendChild(n));
    if (B.scrollHeight > B.clientHeight + 1) sheet.dataset.scrolls = '1';
  } else {
    delete sheet.dataset.scrolls;
    /* spare room on the back goes to other papers */
    const others = papers.filter(x => x !== p && !auto(x)).slice(0, 5);
    if (others.length) {
      const box = document.createElement('div'); box.className = 'more'; box.innerHTML = '<b>Other papers</b>'; B.appendChild(box);
      for (const o of others) {
        const b = document.createElement('button'); b.type = 'button'; b.dataset.open = o.id; b.textContent = o.headline; box.appendChild(b);
        if (over(B)) { b.remove(); break; }
      }
      if (box.children.length < 2) box.remove();
    }
  }
  $('.hint').textContent = sheet.dataset.scrolls ? 'Tap to flip · this older report scrolls on the back' : 'Tap the paper to flip it over';
  sheet.setAttribute('data-fit', fit ? 'yes' : 'no');
  showSide();
}
function showSide() {
  const t = $('#sheet').classList.contains('turned');
  $('#flip').textContent = t ? 'Flip to front' : 'Flip to back';
  $('#front').setAttribute('aria-hidden', t); $('#back').setAttribute('aria-hidden', !t);
  [...$('#front').querySelectorAll('a,button')].forEach(x => { x.tabIndex = t ? -1 : 0; });
  [...$('#back').querySelectorAll('a,button')].forEach(x => { x.tabIndex = t ? 0 : -1; });
}
const flip = () => { $('#sheet').classList.toggle('turned'); showSide(); };

/* tap anywhere on the paper or swipe sideways to flip; links, buttons and scrolling keep working */
let press = null;
const sheetEl = $('#sheet');
sheetEl.addEventListener('pointerdown', e => { press = e.target.closest('a,button,.tablewrap') ? null : { x: e.clientX, y: e.clientY }; });
sheetEl.addEventListener('pointerup', e => {
  if (!press) return;
  const dx = e.clientX - press.x, dy = e.clientY - press.y; press = null;
  const tap = Math.abs(dx) < 10 && Math.abs(dy) < 10, swipe = Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.5;
  if ((tap && !String(getSelection())) || swipe) flip();
});
sheetEl.addEventListener('pointercancel', () => { press = null; });
sheetEl.addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) location.hash = 'a-' + encodeURIComponent(o.dataset.open); });
$('#flip').onclick = flip;
$('#toStand').onclick = () => { location.hash = ''; };
$('#trashOne').innerHTML = BIN + '<span>Trash</span>';
$('#trashOne').onclick = () => { if (cur) toTrash(cur.id); };
addEventListener('keydown', e => {
  if (!$('#tbox').hidden) { if (e.key === 'Escape') $('#tbox').hidden = true; return; }
  if ($('#reader').hidden) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || (e.key === ' ' && !e.target.closest('button'))) { e.preventDefault(); flip(); }
  else if (e.key === 'Escape') location.hash = '';
});
let rt = 0;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 160); });

/* ---- trash: nothing is ever deleted for good from here ---- */
let undo = null, toastT = 0;
function toTrash(id) {
  trash[id] = new Date().toISOString(); saveTrash(); index(); drawStand(); drawTrash();
  if (cur?.id === id) location.hash = '';
  undo = id; $('#toastMsg').textContent = 'Paper moved to the trash'; $('#toast').hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { $('#toast').hidden = true; undo = null; }, 6000);
}
function restore(id) { delete trash[id]; saveTrash(); index(); drawStand(); drawTrash(); }
function drawTrash() {
  const list = all.filter(p => p.id in trash).sort((a, b) => trash[b.id].localeCompare(trash[a.id]));
  $('#tlist').innerHTML = list.length ? list.map(p => `<div class="trow"><span>${esc(p.headline)}</span><button class="tb" type="button" data-restore="${esc(p.id)}">Put back</button></div>`).join('')
    : '<p style="text-align:center;font-style:italic;padding:28px 0;margin:0">The trash can is empty.</p>';
}
$('#trashBtn').onclick = () => { drawTrash(); $('#tbox').hidden = false; $('#tclose').focus(); };
$('#tclose').onclick = () => { $('#tbox').hidden = true; };
$('#tbox').addEventListener('click', e => {
  if (e.target === $('#tbox')) return void ($('#tbox').hidden = true);
  const r = e.target.closest('[data-restore]'); if (r) restore(r.dataset.restore);
});
$('#toastUndo').onclick = () => { if (undo) restore(undo); $('#toast').hidden = true; undo = null; };
$('#rack').addEventListener('click', e => {
  const t = e.target.closest('[data-trash]'); if (t) return toTrash(t.dataset.trash);
  const o = e.target.closest('[data-open]'); if (o) location.hash = 'a-' + encodeURIComponent(o.dataset.open);
});

async function route() {
  if (!ready) return;
  const h = decodeURIComponent((location.hash || '').slice(1));
  const p = h.startsWith('a-') ? all.find(x => x.id === h.slice(2)) : null;
  if (!p) { $('#reader').hidden = true; document.body.classList.remove('reading'); cur = null; return; }
  cur = p; $('#reader').hidden = false; document.body.classList.add('reading');
  $('#sheet').classList.remove('turned');
  try { await document.fonts.ready; } catch {}
  layout();
}

(function boot() {
  $('#today').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  addEventListener('hashchange', route);
  const load = list => { all = list.filter(s => s.headline); index(); drawStand(); drawTrash(); ready = true; route(); };
  (async () => {
    let db = null;
    try { db = window.claude?.use ? await window.claude.use('db') : null; } catch { db = null; }
    if (db) { db.collection('articles').onSnapshot(s => load(s.docs.map(d => ({ id: d.id, ...d.data() }))), () => { $('#rack').innerHTML = `<div class="notice"><h2>The archive didn't answer</h2><p>Reload the page to try again.</p></div>`; }); return; }
    try { const r = await fetch('articles.json', { cache: 'no-cache' }); if (!r.ok) throw 0; load(await r.json()); }
    catch { $('#rack').innerHTML = `<div class="notice"><h2>The press is off</h2><p>The papers could not load. Check your connection and reopen the app.</p></div>`; }
  })();
})();
</script>
