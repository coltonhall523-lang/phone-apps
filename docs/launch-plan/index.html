<style>
/* Same look as the rest of your channel apps: wood-panel console with amber CRT readouts. One deliberate dark look. */
:root{
  --bg:#17100a; --panel:#241910; --panel-2:#2f2116; --line:#4a3523; --line-2:#6a4c31;
  --fg:#f2e3c6; --muted:#b59e7d; --dim:#7d6a52;
  --amber:#f28c28; --amber-2:#ffb347; --crt-bg:#0e0a05; --crt-fg:#ffb000;
  --teal:#5f8f86; --mustard:#d4a73a; --red:#d1492e; --green:#8fb35a; --rust:#a4552c;
  --f-display:"Righteous","Trebuchet MS",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-crt:"VT323","Courier New",ui-monospace,monospace;
  --r:10px; color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(ellipse at 30% -10%,#3a2615 0,transparent 55%),repeating-linear-gradient(90deg,transparent 0 3px,rgba(0,0,0,.06) 3px 4px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em;text-wrap:balance;margin:0;color:var(--amber-2)}
h2{font-size:22px} h3{font-size:17px;color:var(--fg)}
p{margin:0} a{color:var(--amber-2)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px} .num{font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:inset 0 1px 0 rgba(255,230,190,.05),0 6px 0 #0d0804}
.panel.flat{box-shadow:none;background:var(--panel-2)}
.crt{background:var(--crt-bg);color:var(--crt-fg);font-family:var(--f-crt);border-radius:14px;padding:12px 14px;position:relative;overflow:hidden;
  border:3px solid #0a0603;box-shadow:inset 0 0 22px rgba(255,150,0,.12),0 0 0 2px var(--line-2);text-shadow:0 0 6px rgba(255,176,0,.45);min-width:0}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
.crt .big{font-size:40px;line-height:1}
.crt .lbl{font-size:16px;opacity:.75;letter-spacing:.05em;text-transform:uppercase}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--fg);background:#120c07;border:1px solid var(--line-2);border-radius:6px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:80px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn{font-family:var(--f-display);font-size:15px;letter-spacing:.03em;border:0;border-radius:8px;padding:10px 16px;cursor:pointer;color:#1d1006;
  background:linear-gradient(180deg,var(--amber-2),var(--amber));box-shadow:0 4px 0 var(--rust),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--rust)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:var(--panel-2);color:var(--fg);box-shadow:0 3px 0 #0d0804,inset 0 0 0 1px var(--line-2)}
.btn.teal{background:linear-gradient(180deg,#79aaa0,var(--teal));box-shadow:0 4px 0 #34524c,inset 0 1px 0 rgba(255,255,255,.3)}
.btn.green{background:linear-gradient(180deg,#a9c97a,var(--green));box-shadow:0 4px 0 #4d6630,inset 0 1px 0 rgba(255,255,255,.3)}
.btn.sm{font-size:13px;padding:6px 11px;box-shadow:0 3px 0 var(--rust)}
.btn.ghost.sm{box-shadow:0 2px 0 #0d0804,inset 0 0 0 1px var(--line-2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.stamp{display:inline-block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;border:3px solid currentColor;border-radius:6px;padding:4px 12px;transform:rotate(-4deg);opacity:.92}
.ok{color:var(--green)} .bad{color:#f07a5e} .warn{color:var(--mustard)}
.note{border-left:3px solid var(--mustard);padding:8px 12px;background:rgba(212,167,58,.08);border-radius:0 6px 6px 0;font-size:13.5px;color:var(--fg)}
.empty{text-align:center;padding:30px 16px;color:var(--muted);border:2px dashed var(--line);border-radius:var(--r)}
.empty b{display:block;font-family:var(--f-display);font-weight:400;color:var(--fg);font-size:18px;margin-bottom:4px}
.modal{position:fixed;inset:0;background:rgba(8,5,2,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:2px solid var(--line-2);border-radius:14px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 12px 0 #0a0603}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--crt-bg);color:var(--crt-fg);font-family:var(--f-crt);font-size:20px;
  padding:8px 18px;border-radius:8px;border:2px solid var(--line-2);z-index:60;text-shadow:0 0 6px rgba(255,176,0,.5);max-width:calc(100% - 32px)}
.status{font-family:var(--f-crt);font-size:17px;color:var(--crt-fg);display:flex;align-items:center;gap:8px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--crt-fg);box-shadow:0 0 8px var(--crt-fg)}
.status.local{color:var(--mustard)} .status.local::before{background:var(--mustard)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Launch Plan ---- */
.lp{max-width:1180px;margin:0 auto;padding-block:22px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px}
.brand .dial{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--amber-2),var(--amber) 55%,var(--rust));box-shadow:inset 0 -3px 6px rgba(0,0,0,.4),0 0 0 3px #120c06;position:relative;flex:none}
.brand .dial::after{content:"";position:absolute;left:50%;top:7px;width:2px;height:13px;background:#1a0f05;transform-origin:50% 12px;transform:rotate(40deg)}
.brand b{font-family:var(--f-display);font-size:21px;color:var(--fg);font-weight:400;line-height:1.1}
.brand span{display:block;font-size:10.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.stats{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.crt .big{font-size:32px}}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-bottom:2px dashed var(--line);padding-bottom:10px}
.tab{all:unset;cursor:pointer;font-family:var(--f-display);font-size:15px;padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap}
.tab[aria-selected=true]{background:var(--amber);color:#1d1006;border-color:var(--amber)}
.tab:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

.today{display:flex;flex-direction:column;gap:12px;border-left:6px solid var(--ph,var(--amber))}
.today h2{font-size:24px;color:var(--fg)}
.today .goal{max-width:75ch}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav .btn.sm{min-width:40px}
button.status{all:unset;cursor:pointer;font-family:var(--f-crt);font-size:17px;color:var(--crt-fg);display:flex;align-items:center;gap:8px}
button.status:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.status.err{color:#f07a5e} .status.err::before{background:#f07a5e;box-shadow:0 0 8px #f07a5e}

.month{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 5px 0 #0d0804}
.month>summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center}
.month>summary::-webkit-details-marker{display:none}
.month>summary h3{font-size:19px;color:var(--amber-2)}
.month>summary .tgt{font-family:var(--f-crt);font-size:19px;color:var(--crt-fg);text-align:right}
.month>summary .sub{grid-column:1/-1;color:var(--muted);font-size:13.5px}
.mbar{grid-column:1/-1;height:6px;background:#120c07;border-radius:4px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--green)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-flow:dense;gap:10px;padding:4px 14px 16px}
@media (max-width:420px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));padding:4px 10px 14px}}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;display:flex;flex-direction:column;gap:6px;min-height:118px;padding:10px 11px 12px;border-radius:9px;
  background:#120c07;border:1px solid var(--line-2);border-top:4px solid var(--ph);min-width:0}
.card:hover{border-color:var(--amber)}
.card:focus-visible{outline:2px solid var(--amber-2);outline-offset:2px}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:6px;font-size:10.5px;letter-spacing:.04em;white-space:nowrap;text-transform:uppercase;color:var(--muted);font-weight:600}
.card .meta b{font-family:var(--f-crt);font-size:17px;letter-spacing:0;color:var(--crt-fg);font-weight:400;line-height:1}
.card .t{font-size:14.5px;line-height:1.3;color:var(--fg);font-weight:600;overflow-wrap:anywhere}
.card .foot{margin-top:auto;display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--dim)}
.card.we{grid-column:span 2;background:linear-gradient(135deg,#1e140b,#120c07);border-color:var(--ph);min-height:132px}
.card.we .t{font-family:var(--f-display);font-weight:400;font-size:17px;color:var(--amber-2)}
.card.we .wtag{color:var(--ph);font-weight:700}
.card.done{opacity:.55}
.card.done .t{text-decoration:line-through;text-decoration-color:var(--green);text-decoration-thickness:2px}
.card .chk{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--green);color:#10200a;display:none;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid var(--bg)}
.card.done .chk{display:flex}
.card.istoday{box-shadow:0 0 0 3px var(--bg),0 0 0 5px #fff4c2,0 0 20px 4px rgba(255,190,80,.55);z-index:1}
.card.missed{border-color:#7a3324}
.card .ms{color:var(--fg);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}

.goal{font-size:16px;line-height:1.6}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.kv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv.kv5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:560px){.kv.kv5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv .crt{padding:8px 10px}
.kv .crt .big{font-size:26px}
.kv .crt .lbl{font-size:14px}

.flow{display:grid;gap:8px}
.flowrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line)}
.flowrow .n{font-family:var(--f-crt);font-size:22px;color:var(--crt-fg)}
.who{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.who.bot{background:rgba(95,143,134,.2);color:#8cc0b6;border:1px solid #5f8f86}
.who.you{background:rgba(242,140,40,.18);color:var(--amber-2);border:1px solid var(--amber)}
@media (max-width:520px){.flowrow{grid-template-columns:24px minmax(0,1fr)}.flowrow .who{grid-column:2;justify-self:start}}
.mathbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:2px solid #0a0603}
.mathbar span{display:flex;align-items:center;justify-content:center;font-family:var(--f-crt);font-size:18px;color:#140c05;min-width:0;overflow:hidden;white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:7px 8px;border-bottom:1px dashed var(--line)}
table.t th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
table.t td.r,table.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.rv h4{margin:0 0 3px;font-family:var(--f-display);font-weight:400;color:var(--amber-2);font-size:15px}
</style>
<script>
/* ================= PLAN DATA (v3: test week first, Oct 31 2026) =================
   v3 change: apps "good enough" by Sun Nov 1, 5 test videos Mon Nov 2 - Fri Nov 6, niche verdict Sat Nov 7,
   buy-a-channel gate on Checkpoint 1 (Nov 29). Coach's reasoning is in the Newspaper.
   Goal 1: $5,000/month by Mon Dec 21, 2026 (start of Christmas break, day 55).
   Goal 2: $10,000/month by the last day of the plan (day 364).
   Time budget: weekdays up to 45 min, Saturdays + Sundays 2–3 h each (~9 h a week).
   The sprint (Oct 28 – Dec 23) is written day by day in calendar order.
   t = short label, d = goal of the day, w = done when, m = minutes, ms = milestone */
const SPRINT_WD = [
/* Wed Oct 28 – Fri Oct 30 */
 {phase:'Foundation', t:'Give Claude the 7-fix prompt', m:15, d:'Your Second Brain is the research engine for the whole channel, so it has to be right first. Open the NotebookLM answer called "Prompt for Claude" in your Briefings notebook, copy it, and paste it into Claude to apply fixes 1–7 (typical vs upside profit, monetized status, video length, no duplicate saves, What If titles, script length, channel name).', w:'Claude confirms all 7 fixes are applied and the Second Brain reloads without errors.'},
 {phase:'Foundation', t:'Test all 7 Second Brain fixes', m:45, d:"One sitting for every fix. (1–4) Run Competitor Analysis on Alternate You: you should see a Typical (median) AND Upside (average) estimate, a “Monetized?” line and an Average Video Length box; click Validate once in the Niche Validator and make sure only ONE record saves. (5–7) “What If You Aged 1 Year Every Day?” should score above the old 5/10 in the Title Validator; a 2-minute script with the length box at 10 min should get a warning; typing a channel by hand should fill the Channel Name box.", w:'All 7 fixes work, or what broke is written in today’s notes for Claude.'},
 {phase:'Foundation', t:'Test Thumbnail Validator + vidIQ link fill', m:40, d:"Upload a MagnatesMedia downfall thumbnail (1M+ views) and a weak one from a small channel; the big one should score clearly higher. Then test your data bridge: if Claude Code finished the vidIQ “paste a link, fill everything” feature, paste one finance channel link and check every field fills. If not, run yt-pull.py once and paste the YT1: code instead. You need fast, real data for this weekend’s niche test.", w:'Thumbnail scores make sense and one channel’s data fills automatically.'},
/* Mon Nov 2 – Fri Nov 6 */
 {phase:'Test Week', t:'Test videos #1 and #2 go live', m:45, ms:'Test week starts', d:"Publish test videos #1 and #2 in YouTube Studio (title, thumbnail, description, captions, end screen). You planned all 5 today. Better: 2 today, then 1 a day. Each video then gets its own first-day push, and you can fix packaging on #3–#5 from what #1–#2 show you. All 5 must be the SAME sub-niche and the SAME format, or the test tells you nothing. Answer the “altered or synthetic content” question honestly.", w:'Two videos public; #3 is ready for tomorrow.'},
 {phase:'Test Week', t:'Test video #3 + read the first 24 hours', m:40, d:"Publish #3. Then open Studio for #1 and #2 and write down 3 numbers each: impressions, click-through rate (CTR = clicks ÷ impressions) and views. Judge CTR in the first 1–2 days; it falls as a video spreads. Normal CTR is 2–10%.", w:'#3 public; impressions, CTR and views for #1–#2 in notes.'},
 {phase:'Test Week', t:'Coach reset: make the 3 calls, then test 3 images', m:60, ms:'Saturday push', d:"Changed Nov 4 by the coach: nothing is posted yet, so the old daily-upload steps no longer fit. Three scripts, voices and projects are already built. Tonight: (1) decide cartoon or paintings; (2) confirm the channel exists with phone verified, or create it; (3) add a fal.ai key on Workstation > Connections, with about $5 of credit, then make 3 test images in project V1. Full steps: ~/coach/launch/saturday-2026-11-07/START-HERE.md.", w:'Cartoon decision made, channel verified, 3 test images look like the same Mort.'},
 {phase:'Test Week', t:'Build video #1 (Japanese monsters)', m:120, d:"Changed Nov 4 by the coach. In the Workstation open V1 and press Auto-Build. Fix bad images, add free music, watch the whole thing, then export. The Editor takes it from there on his own while you sleep. Leave the Chromebook plugged in and awake. Before posting anything, compare your videos side by side: each needs its own research and jokes, or YouTube's inauthentic content rule can block money later.", w:'V1 exported and watched start to finish; Editor job started.'},
 {phase:'Test Week', t:'Build video #2, start #3', m:120, d:"Changed Nov 4 by the coach. Check the Editor's cut of V1. Build V2 (Slavic), then V3 (Norse) if there is time. Make all 3 thumbnails from the concepts in START-HERE.md.", w:'V2 exported; V1 cut approved; thumbnails made.'},
/* Mon Nov 9 – Fri Nov 13 */
 {phase:'Build the Machine', t:'Approve research + script #1', m:45, d:"Read research #1 (one clear decision? real sources? anything made up?), then read script #1 out loud once. You’re listening for boring stretches and generic AI filler. Approving research and scripts is the job you keep forever.", w:'Research and script #1 approved, or fixes noted for Claude.'},
 {phase:'Build the Machine', t:'Voiceover #1 + visual style sheet', m:35, d:"Have Claude Code generate audio/video1.mp3 with your channel voice and listen to the first 2 minutes. Then approve visuals/STYLE.md: 2 brand colors, font, how charts and maps look, and when to use stock footage vs motion graphics.", w:'Voice file sounds clean; STYLE.md approved.'},
 {phase:'Build the Machine', t:'Have Claude build the chart & map maker', m:45, d:"Ask Claude Code for a script that turns numbers from the research (stock price, revenue, store count) into animated chart clips in your colors. These clips are what make you look different from slideshow channels, and originality is what keeps you monetizable.", w:'One animated chart renders to an .mp4.'},
 {phase:'Build the Machine', t:'Shot list + 60-second test render', m:40, d:"Claude matches every script line to a visual (stock clip, chart, map, text card) in visuals/video1-shots.md. Skim it, then have it render just the first 60 seconds. Watch it on your phone: does the cold open grab you in 10 seconds?", w:'Shot list approved; test render watched and notes given.'},
 {phase:'Build the Machine', t:'Description template + research #2 and #3', m:40, d:"Have Claude write a reusable description: 2 hook lines, chapters, sources, “not financial advice”, and an affiliate section with a disclosure line (“Some links are affiliate links; I may earn a commission.” The law requires it). Then have the research skill run stories #2 and #3 so they’re ready right after launch. Working one video ahead is how you hit 4 a week later.", w:'Template saved; research #2 and #3 waiting for you.'},
/* Mon Nov 16 – Fri Nov 20 */
 {phase:'Launch Sprint', t:'Approve scripts #2 and #3', m:40, d:"Check only the hook (first 3 lines), the pivotal decision, and anything Claude flagged as “needs a source”.", w:'Both approved.'},
 {phase:'Launch Sprint', t:'Apply to 2 affiliate programs', m:40, d:"Affiliates are the only money you can earn before YouTube’s Partner Program, so start now. Pick 1–2 that approve new creators (a business tool, or an investing/stock-research app with a creator program; read their rules on finance promotions). Skip Amazon Associates for now: it closes accounts without 3 sales in 180 days. Links are only clickable after advanced features are unlocked (Nov 1 task).", w:'1–2 applications sent.'},
 {phase:'Launch Sprint', t:'Approve packaging + publish video #2', m:30, d:"Pick from Claude’s 3 thumbnails and 5 titles (Title Validator 8/10+ only). The robot uploaded it as Private; open YouTube Studio, add the end screen, and switch it to Public.", w:'Video #2 public.'},
 {phase:'Launch Sprint', t:'Read video #1’s first numbers', m:30, d:"In Studio look at 3 things: click-through rate (CTR, aim 4%+), average view duration (aim 40%+), and where viewers drop. If CTR is under 3% after 48 hours, swap in your second-best thumbnail today. On a 7-week deadline you can’t wait a week to fix packaging.", w:'3 numbers in notes; thumbnail swapped if CTR < 3%.'},

  const log = DAYS.slice(0, t).map(d => { const r = prog['d' + d.n] || {}; return `Day ${d.n} (${d.date.toLocaleDateString('en', { weekday: 'short' })}) [${d.phase}] ${d.t}: ${r.done ? 'DONE' : 'not done'}${r.notes ? ' | notes: ' + r.notes.slice(0, 160) : ''}${r.actual && r.actual.inc != null ? ' | income $' + r.actual.inc : ''}${r.actual && r.actual.subs != null ? ' | subs ' + r.actual.subs : ''}${r.actual && r.actual.hrs != null ? ' | watch hrs ' + r.actual.hrs : ''}`; }).slice(-60);
  const tg = target(t), next = DAYS.slice(t).find(d => d.ms);
  const prompt = `You are a direct, encouraging accountability coach for Colton, a beginner building a faceless business-documentary YouTube channel that Claude Code mostly runs. Goals: $5,000/month by Dec 21, 2026 (start of his Christmas break, day 55) and $10,000/month by day ${TOTAL}. He just started a new job: about 45 minutes on weekdays and 2-3 hours each Saturday and Sunday. Be honest if the pace makes a goal unlikely, and say what would help most. Today is day ${t} of ${TOTAL}.
Pace target today: income $${Math.round(tg.inc)}/mo, ${Math.round(tg.vids)} videos, ${Math.round(tg.subs)} subs, ${Math.round(tg.hrs)} watch hours.
Next milestone: ${next ? 'Day ' + next.n + ' - ' + next.ms : 'final check'}.
Recent log (up to 60 days):\n${log.join('\n')}

Reply with ONLY a JSON object: {"working":"...","avoiding":"...","pattern":"...","this_week":"..."}
- working: what he is doing consistently (1-2 sentences).
- avoiding: tasks skipped or types of tasks he avoids. Say it plainly.
- pattern: weekdays skipped, gaps over 3 days, or pace vs target. If none, say so.
- this_week: one concrete thing to do this week tied to the next milestone.
Short, plain words, no padding.`;
  try { const r = await AI.json(prompt, { cache: false }); await Store.put('lp12_reviews', { date: todayISO(), day: t, working: String(r.working || ''), avoiding: String(r.avoiding || ''), pattern: String(r.pattern || ''), this_week: String(r.this_week || '') }); toast('Review saved'); }
  catch (err) { toast(AI.explain(err)); }
});
function renderReviews() {
  const list = [...reviews].sort((a, b) => (b.created_date || '').localeCompare(a.created_date || ''));
  $('#reviewList').replaceChildren(list.length ? h('div', { class: 'stack' }, list.map((r, i) =>
    h('details', { class: 'panel flat', open: i === 0 || null }, h('summary', { style: 'cursor:pointer', text: `${fmtDate(r.date)} · Day ${r.day}` }),
      h('div', { class: 'grid g2', style: 'margin-top:12px' }, [['What\'s working', r.working], ['What you\'re avoiding', r.avoiding], ['Your pattern', r.pattern], ['One thing this week', r.this_week]]
        .map(([k, v]) => h('div', { class: 'rv' }, h('h4', { text: k }), h('p', { text: v })))))))
    : h('div', { class: 'empty' }, h('b', { text: 'No reviews yet' }), 'Check off a few days, then press "Review my progress".'));
}

/* ---- wiring ---- */
$$('.tab').forEach(b => b.onclick = () => { $$('.tab').forEach(x => x.setAttribute('aria-selected', String(x === b))); ['plan', 'auto', 'math', 'reviews'].forEach(k => $('#tab-' + k).hidden = k !== b.dataset.tab); });
$('#todayBtn').onclick = () => {
  $$('.tab')[0].click(); const t = Math.min(Math.max(todayN(), 1), TOTAL), m = Math.min(12, Math.floor((t - 1) / (TOTAL / 12)) + 1);
  const det = $(`#months details[data-m="${m}"]`); if (det) det.open = true;
  const c = $('#card' + t); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.focus({ preventScroll: true }); }
};
$('#saveStatus').onclick = () => syncSetup();
$('#startDate').onchange = async e => { if (!e.target.value) return; settings.start = e.target.value; $('#months').replaceChildren(); render(); try { await Store.put('lp12_settings', { ...settings, id: 'main' }); toast('Start date saved'); } catch {} };

(async () => {
  AI.init(); renderAuto(); renderMath(); render();
  await Store.init('launchplan12');
  if (Store.mode !== 'cloud') { $('#reviewBtn').hidden = true; $('#reviewHint').textContent = 'Ask the Coach in Claude Code for a review of your progress; it reads the same synced plan.'; }
  Store.watch('lp12_days', list => { prog = Object.fromEntries(list.map(d => [d.id, d])); render(); });
  Store.watch('lp12_reviews', list => { reviews = list; renderReviews(); });
  /* only claude.ai saves a default start date; a synced device takes the shared one, so a fresh phone can't reset it */
  if (Store.mode === 'cloud') try { if (!(await Store.get('lp12_settings', 'main'))) await Store.put('lp12_settings', { id: 'main', start: todayISO() }); } catch {}
  Store.watch('lp12_settings', list => { const s = list.find(x => x.id === 'main'); if (s && s.start !== settings.start) { settings.start = s.start; $('#months').replaceChildren(); render(); } });
})();
</script>
