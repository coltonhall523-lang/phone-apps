name: Newspaper alerts
on:
  push:
    branches: [main]
    paths: ['docs/newspaper/articles.json']
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pywebpush==2.5.0
      - name: Alert phones about new stories
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBS: ${{ secrets.PUSH_SUBS }}
          BEFORE: ${{ github.event.before }}
        run: |
          git show "$BEFORE:docs/newspaper/articles.json" > /tmp/old.json 2>/dev/null || echo '[]' > /tmp/old.json
          python .github/push/send.py newspaper /tmp/old.json docs/newspaper/articles.json
